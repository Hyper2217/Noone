<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Breach</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #00ff66;
    font-family: "Courier New", monospace;
    min-height: 100vh;
    overflow: hidden;
}

#terminal {
    padding: 20px;
    height: 100vh;
    overflow: hidden;
    text-shadow: 0 0 8px #00ff66;
}

.line {
    margin: 7px 0;
    font-size: 14px;
}

.warning {
    color: #ff3333;
    text-shadow: 0 0 8px red;
}

.yellow {
    color: #ffff00;
}

.progressBox {
    width: 100%;
    height: 18px;
    border: 1px solid #00ff66;
    margin: 12px 0;
}

.progress {
    width: 0%;
    height: 100%;
    background: #00ff66;
    box-shadow: 0 0 12px #00ff66;
}

#reveal {
    display: none;
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, #111 0%, #000 70%);
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
}

.card {
    border: 1px solid #00ff66;
    padding: 35px 20px;
    max-width: 450px;
    box-shadow: 0 0 30px #00ff66;
    animation: pulse 1.5s infinite alternate;
}

.card h1 {
    color: #ff3366;
    font-family: Arial, sans-serif;
    font-size: 38px;
}

.card p {
    color: white;
    font-family: Arial, sans-serif;
    font-size: 18px;
    line-height: 1.6;
}

button {
    margin-top: 15px;
    padding: 12px 25px;
    background: transparent;
    color: #00ff66;
    border: 1px solid #00ff66;
    font-family: monospace;
    cursor: pointer;
}

button:hover {
    background: #00ff66;
    color: black;
}

@keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.03); }
}
</style>
</head>

<body>

<div id="terminal"></div>

<div id="reveal">
    <div class="card">
        <div style="font-size:55px;">❤️</div>
        <h1>SYSTEM COMPROMISED</h1>

        <p>
            Congratulations.<br><br>
            Your device wasn't actually hacked...
        </p>

        <p style="color:#00ff66;">
            I hacked your heart instead. 😏❤️
        </p>

        <p>
            And unfortunately for you...
            <br>
            there's no antivirus for that. 😂
        </p>

        <button onclick="location.reload()">RUN AGAIN</button>
    </div>
</div>

<script>
const terminal = document.getElementById("terminal");

const messages = [
    ["Initializing secure connection...", ""],
    ["Connecting to remote server...", ""],
    ["Connection established.", ""],
    ["Scanning target...", "yellow"],
    ["Finding vulnerable ports...", ""],
    ["Port 443 OPEN", ""],
    ["Port 8080 OPEN", ""],
    ["Bypassing firewall...", "yellow"],
    ["Firewall bypassed.", ""],
    ["Accessing encrypted database...", ""],
    ["Decrypting files...", ""],
    ["Downloading secret files...", ""],
    ["Analyzing personal data...", "warning"],
    ["ERROR: Too much cuteness detected.", "warning"],
    ["Attempting emergency override...", "yellow"],
    ["Override successful.", ""],
    ["Searching for weakness...", ""],
    ["WEAKNESS FOUND.", "warning"],
    ["Target vulnerability: HEART ❤️", "warning"],
    ["Injecting LOVE.exe...", ""]
];

let index = 0;

function addLine(text, type = "") {
    const div = document.createElement("div");
    div.className = "line " + type;
    div.textContent = "> " + text;
    terminal.appendChild(div);

    terminal.scrollTop = terminal.scrollHeight;
}

function progressAnimation(callback) {
    const box = document.createElement("div");
    box.className = "progressBox";

    const bar = document.createElement("div");
    bar.className = "progress";

    box.appendChild(bar);
    terminal.appendChild(box);

    let percent = 0;

    const timer = setInterval(() => {
        percent += Math.floor(Math.random() * 8) + 3;

        if (percent >= 100) {
            percent = 100;
            clearInterval(timer);
            setTimeout(callback, 500);
        }

        bar.style.width = percent + "%";
    }, 150);
}

function run() {
    if (index >= messages.length) {
        setTimeout(finalSequence, 800);
        return;
    }

    const [text, type] = messages[index];

    addLine(text, type);
    index++;

    if (
        text.includes("Decrypting") ||
        text.includes("Downloading") ||
        text.includes("Injecting")
    ) {
        progressAnimation(run);
    } else {
        setTimeout(run, Math.random() * 500 + 350);
    }
}

function finalSequence() {
    addLine("");
    addLine("FINALIZING OPERATION...", "yellow");

    setTimeout(() => {
        addLine("ACCESS GRANTED ❤️", "");
    }, 1000);

    setTimeout(() => {
        addLine("TARGET HEART SUCCESSFULLY HACKED.", "warning");
    }, 2200);

    setTimeout(() => {
        document.getElementById("reveal").style.display = "flex";
    }, 3500);
}

run();
</script>

</body>
</html>
