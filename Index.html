<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Question ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: white;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 400px;
    position: relative;
}

.heart {
    font-size: 90px;
    animation: bounce 1.2s infinite;
    filter: drop-shadow(0 10px 15px rgba(0,0,0,.2));
}

@keyframes bounce {
    0%,100% {
        transform: translateY(0) scale(1);
    }

    50% {
        transform: translateY(-25px) scale(1.08);
    }
}

h1 {
    font-size: 30px;
    margin: 15px 0;
}

p {
    font-size: 18px;
    line-height: 1.5;
}

.buttons {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

button {
    border: none;
    padding: 13px 25px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .25s;
}

#yes {
    background: white;
    color: #ff477e;
}

#no {
    background: rgba(255,255,255,.25);
    color: white;
}

/* BACK BUTTON */

.back {
    position: fixed;
    top: 20px;
    left: 20px;

    width: 45px;
    height: 45px;

    padding: 0;

    border-radius: 50%;

    background: rgba(255,255,255,.25);
    color: white;

    font-size: 25px;

    display: flex;
    justify-content: center;
    align-items: center;

    backdrop-filter: blur(8px);

    box-shadow: 0 5px 15px rgba(0,0,0,.15);

    z-index: 10;
}

.back:hover {
    transform: scale(1.1);
    background: rgba(255,255,255,.4);
}

.hidden {
    display: none;
}

.message {
    animation: appear .7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.floating-heart {
    position: fixed;
    bottom: -30px;
    font-size: 25px;
    animation: float 5s linear forwards;
    pointer-events: none;
}

@keyframes float {

    from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }

    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

#proposal h2 {
    font-size: 28px;
}

.love {
    font-size: 45px;
    animation: pulse 1s infinite;
}

@keyframes pulse {

    50% {
        transform: scale(1.25);
    }
}
</style>
</head>

<body>

<!-- BACK BUTTON -->
<button id="backBtn" class="back hidden">←</button>


<div class="container">

    <!-- FIRST PAGE -->

    <div id="question">

        <div class="heart">❤️</div>

        <h1>Hey Noone.. 👀❤️</h1>

        <p>
            I have a tiny question for you...
            <br>
            Please answer honestly 😌
        </p>

        <h2>Do you love me? ❤️</h2>

        <div class="buttons">

            <button id="yes">
                YES ❤️
            </button>

            <button id="no">
                NO 😏
            </button>

        </div>

    </div>


    <!-- PROPOSAL PAGE -->

    <div id="proposal" class="hidden message">

        <div class="love">
            💖
        </div>

        <h1>
            I knew it! 😭❤️
        </h1>

        <p>
            So since you love me...
            <br><br>
            I have one more question.
        </p>

        <h2>
            Will you be mine? 💍❤️
        </h2>

        <button id="finalYes">
            YES, I WILL ❤️
        </button>

    </div>


    <!-- FINAL PAGE -->

    <div id="final" class="hidden message">

        <div class="love">
            💍❤️
        </div>

        <h1>
            YAAAAAY! 🥹❤️
        </h1>

        <p>
            You just made me the happiest person alive.
            <br><br>
            I love you. ❤️
        </p>

    </div>

</div>


<script>

const yes = document.getElementById("yes");
const no = document.getElementById("no");

const question = document.getElementById("question");
const proposal = document.getElementById("proposal");
const final = document.getElementById("final");

const finalYes = document.getElementById("finalYes");

const backBtn = document.getElementById("backBtn");

let noCount = 0;


/* NO BUTTON */

no.addEventListener("click", function() {

    noCount++;

    if (noCount === 1) {

        no.innerText = "Are you sure? 👀";

    }

    else if (noCount === 2) {

        no.innerText = "Think again 😭";

    }

    else if (noCount === 3) {

        no.innerText = "Really? 🥺";

    }

    else {

        no.innerText = "You can't escape ❤️";

        no.style.position = "fixed";

        no.style.left =
            Math.random() * (window.innerWidth - 150) + "px";

        no.style.top =
            Math.random() * (window.innerHeight - 70) + "px";

    }

});


/* YES BUTTON */

yes.addEventListener("click", function() {

    question.classList.add("hidden");

    proposal.classList.remove("hidden");

    backBtn.classList.remove("hidden");

    createHearts(15);

});


/* BACK BUTTON */

backBtn.addEventListener("click", function() {

    proposal.classList.add("hidden");

    final.classList.add("hidden");

    question.classList.remove("hidden");

    backBtn.classList.add("hidden");

    // Reset NO button
    noCount = 0;

    no.innerText = "NO 😏";

    no.style.position = "";
    no.style.left = "";
    no.style.top = "";

});


/* FINAL YES */

finalYes.addEventListener("click", function() {

    proposal.classList.add("hidden");

    final.classList.remove("hidden");

    createHearts(40);

});


/* FLOATING HEARTS */

function createHearts(amount) {

    for (let i = 0; i < amount; i++) {

        const heart =
            document.createElement("div");

        heart.className =
            "floating-heart";

        heart.innerHTML =
            ["❤️","💕","💖","💗","💘"]
            [Math.floor(Math.random() * 5)];

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.animationDuration =
            (3 + Math.random() * 3) + "s";

        heart.style.fontSize =
            (18 + Math.random() * 25) + "px";

        document.body.appendChild(heart);

        setTimeout(() => {

            heart.remove();

        }, 6000);

    }

}

</script>

</body>
</html>
